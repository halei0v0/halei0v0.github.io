<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>个人导航 - 哈雷0V0</title>
  <style>
    :root{
      --bg:#071025;--card:#071428;--muted:#9fb0c6;--accent:#60a5fa;--glass:rgba(255,255,255,0.03);
      --accent-2:#a78bfa;--accent-3:#22d3ee;
      --ring:conic-gradient(from 180deg,#60a5fa,#a78bfa,#22d3ee,#60a5fa);
      --card-border:rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#e6eef8;
      background:radial-gradient(1200px 800px at 10% -10%,rgba(96,165,250,0.10),transparent 60%),
                 radial-gradient(900px 700px at 110% 10%,rgba(167,139,250,0.10),transparent 55%),
                 linear-gradient(180deg,var(--bg) 0%,#02101a 100%);
      background-attachment:fixed;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    /* 动态背景光晕 */
    body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
      background:
        radial-gradient(40vw 40vw at 20% 30%,rgba(96,165,250,0.08),transparent 60%),
        radial-gradient(35vw 35vw at 80% 70%,rgba(167,139,250,0.07),transparent 60%);
      animation:float 18s ease-in-out infinite alternate;filter:blur(10px);
    }
    @keyframes float{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-24px,0) scale(1.05)}}
    .container{position:relative;z-index:1;width:100%;max-width:1280px;
      background:linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0.01));
      border:1px solid var(--card-border);border-radius:18px;overflow:hidden;
      display:grid;grid-template-columns:360px 1fr;gap:0;
      box-shadow:0 10px 40px rgba(2,6,23,0.6),0 0 0 1px rgba(255,255,255,0.02) inset;
      backdrop-filter:blur(6px);
    }
    .sidebar{background:linear-gradient(180deg,rgba(8,20,38,0.6),rgba(7,20,40,0.4));padding:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-right:1px solid rgba(255,255,255,0.04);position:relative}
    .sidebar::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,rgba(96,165,250,0.08),transparent 60%);pointer-events:none}
    .avatar-wrap{position:relative;width:168px;height:168px;display:grid;place-items:center}
    .avatar-wrap::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--ring);filter:blur(0.5px);opacity:.9;animation:spin 8s linear infinite}
    .avatar{position:relative;width:160px;height:160px;border-radius:50%;overflow:hidden;border:4px solid #071428;background:linear-gradient(135deg,#081426,#0b1a2a);box-shadow:0 0 0 1px rgba(255,255,255,0.05),0 12px 30px rgba(0,0,0,0.45)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    h1{margin:18px 0 6px;font-size:22px;letter-spacing:0.4px;color:#f2f7ff;position:relative}
    h1::after{content:"";display:block;width:36px;height:3px;margin:10px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
    .muted{color:var(--muted);font-size:14px;margin-bottom:10px;line-height:1.5}
    /* links: grid 3 per row, icon + label */
    .links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;width:100%;align-items:center;justify-items:center;position:relative;z-index:1}
    .links a{color:var(--accent);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;border-radius:12px;border:1px solid var(--glass);background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);width:100%;max-width:130px;transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s ease,border-color .2s ease,background .2s ease}
    .links a:hover{transform:translateY(-4px);border-color:rgba(96,165,250,0.35);box-shadow:0 10px 24px rgba(3,10,30,0.55);background:linear-gradient(180deg,rgba(96,165,250,0.08),transparent)}
    .links .icon{width:28px;height:28px;display:block;fill:var(--accent);transition:transform .2s ease,filter .2s ease}
    .links a:hover .icon{transform:scale(1.08);filter:drop-shadow(0 0 8px rgba(96,165,250,0.5))}
    .links .label{font-size:12px;color:var(--muted)}
    .main{padding:36px;position:relative}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .title{font-size:20px;color:#eaf6ff;font-weight:600;letter-spacing:.3px}
    .sub{color:var(--muted);font-size:13px;margin-top:4px}
    .repo-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    /* 更小屏幕时仓库卡片允许更窄一些 */
    @media (max-width:480px){.repo-list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
    .repo{position:relative;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,0.04);transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s ease,border-color .18s ease;overflow:hidden;animation:rise .4s ease both}
    .repo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:0;transition:opacity .2s ease}
    .repo:hover{transform:translateY(-6px);border-color:rgba(96,165,250,0.28);box-shadow:0 20px 44px rgba(2,8,24,0.6)}
    .repo:hover::before{opacity:1}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .repo a{color:var(--accent);text-decoration:none;font-weight:700;font-size:15px;transition:color .15s ease}
    .repo a:hover{color:#bcdcff}
    .repo .desc{color:var(--muted);font-size:13px;margin-top:8px;min-height:36px;line-height:1.5}
    .meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin-top:12px;flex-wrap:wrap}
    .lang-dot{display:inline-flex;align-items:center;gap:6px}
    .lang-dot .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
    .star{color:#f0b429}
    .spinner{width:32px;height:32px;border:4px solid rgba(255,255,255,0.06);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{color:var(--muted);padding:22px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.06);text-align:center}
    /* 分页控件 */
    .pagination{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:20px}
    .pagination button{background:linear-gradient(180deg,rgba(96,165,250,0.08),transparent);border:1px solid rgba(96,165,250,0.2);color:var(--accent);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px;transition:transform .15s ease,border-color .15s ease,background .15s ease}
    .pagination button:hover{transform:translateY(-2px);border-color:rgba(96,165,250,0.5);background:linear-gradient(180deg,rgba(96,165,250,0.16),transparent)}
    .pagination button:disabled{opacity:0.35;cursor:not-allowed;transform:none}
    .pagination span{color:var(--muted);font-size:13px}
    /* 骨架屏（加载占位） */
    .skeleton-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
    @media (max-width:480px){.skeleton-list{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
    .skeleton{padding:18px;border-radius:14px;border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent)}
    .skeleton .sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.08),rgba(255,255,255,0.04));background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
    .skeleton .sk-title{width:55%;height:15px;margin-bottom:10px}
    .skeleton .sk-desc{height:12px;margin-bottom:8px}
    .skeleton .sk-desc2{width:70%;height:12px;margin-bottom:14px}
    .skeleton .sk-meta{display:flex;gap:12px;margin-top:10px}
    .skeleton .sk-meta div{width:60px;height:10px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @media (max-width:980px){
      .container{grid-template-columns:1fr;max-width:940px}
      /* 手机端：在移动端直接显示侧边栏（不使用汉堡菜单，可选） */
      .sidebar{flex-direction:column;gap:12px;padding:18px;align-items:center;text-align:center;position:static;transform:none;transition:none;z-index:auto;border-radius:14px}
      .avatar{width:96px;height:96px}
      .avatar-wrap{width:104px;height:104px}
      .links{grid-template-columns:repeat(3,auto);width:auto}
      .main{padding:20px}
      /* 在移动端隐藏汉堡按钮（始终显示个人信息） */
      .hamburger{display:none}
    }
    /* 更小屏幕的链接布局与更大触控目标 */
    @media (max-width:480px){
      body{padding:14px}
      .links{grid-template-columns:repeat(2,1fr);gap:12px}
      .links a{padding:12px}
      h1{font-size:18px}
      .title{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <aside class="sidebar">
      <div class="avatar-wrap">
        <div class="avatar"><img id="avatarImg" src="https://avatars.githubusercontent.com/u/0?v=4" alt="avatar"/></div>
      </div>
      <h1 id="displayName">哈雷0V0</h1>
      <div class="muted" id="bio">一个神秘的up主，带你打开新的世界!</div>
      <div class="links" id="basicLinks">
        <a href="https://blog.halei0v0.dpdns.org" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 12v7a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span class="label">Blog</span>
        </a>

          <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 7c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"></path><path d="M8 11h8M8 14h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="label">Bilibili</span>

          <span class="label">GitHub</span>
        </a>
        <a href="https://picture.halei0v0.ccwu.cc/" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">图床</span>
        </a>
      </div>
    </aside>
    <main class="main">
      <div class="header">
        <div>
          <div class="title">项目与简介</div>
          <div class="sub">一个神秘的up主，带你打开新的世界!【哈雷0V0，一个高中生UP主】</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div id="statusArea"><div class="spinner" id="loadingSpinner"></div></div>
        </div>
      </div>
      <div id="reposContainer">
        <div class="skeleton-list" id="skeletonList"></div>
      </div>
    </main>
  </div>

  <script>
    const username = 'halei0v0';
    const avatarImg = document.getElementById('avatarImg');
    const displayName = document.getElementById('displayName');
    const bio = document.getElementById('bio');
    const reposContainer = document.getElementById('reposContainer');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // GitHub 语言对应的主色调（用于仓库卡片小圆点）
    const langColors = {
      'JavaScript':'#f1e05a','TypeScript':'#3178c6','Python':'#3572A5','HTML':'#e34c26','CSS':'#563d7c',
      'Java':'#b07219','C':'#555555','C++':'#f34b7d','C#':'#178600','Go':'#00ADD8','Rust':'#dea584',
      'PHP':'#4F5D95','Ruby':'#701516','Swift':'#F05138','Kotlin':'#A97BFF','Dart':'#00B4AB',
      'Vue':'#41b883','Shell':'#89e051','Jupyter Notebook':'#DA5B0B','Lua':'#000080',
      'SCSS':'#c6538c','Less':'#1d365d','Markdown':'#083fa1','Dockerfile':'#384d54','Makefile':'#427819'
    };
    const langColor = (l) => l ? (langColors[l] || '#8b98a8') : '#8b98a8';

    // 本地缓存：避免每次访问都请求 GitHub API（匿名用户每小时仅 60 次）
    const CACHE_KEY = `gh:${username}:v1`;
    const CACHE_TTL = 10 * 60 * 1000; // 10 分钟内直接复用缓存
    function readCache(){
      try{
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !data.ts) return null;
        return data; // { ts, user, repos }
      }catch{ return null; }
    }
    function writeCache(user, repos){
      try{
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), user, repos }));
      }catch{ /* 配额不足时静默忽略 */ }
    }

    // 分页与仓库缓存设置
    let storedRepos = [];
    let currentPage = 1;
    const pageSize = 6; // 每页最多显示 6 个仓库

    // 渲染骨架屏占位
    function renderSkeleton(count = 6){
      const list = document.createElement('div');
      list.className = 'skeleton-list';
      for (let i = 0; i < count; i++){
        const s = document.createElement('div');
        s.className = 'skeleton';
        s.innerHTML = '<div class="sk-line sk-title"></div><div class="sk-line sk-desc"></div><div class="sk-line sk-desc2"></div><div class="sk-meta"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>';
        list.appendChild(s);
      }
      reposContainer.innerHTML = '';
      reposContainer.appendChild(list);
    }

    function applyUser(user){
      if (!user) return;
      avatarImg.src = user.avatar_url || avatarImg.src;
      displayName.textContent = user.name || user.login || username;
      bio.textContent = user.bio || (user.location ? user.location : 'The world is big！You have to see~');
    }

    async function fetchGitHub() {
      // 1) 命中新鲜缓存：直接渲染，免请求
      const cached = readCache();
      if (cached && (Date.now() - cached.ts) < CACHE_TTL){
        applyUser(cached.user);
        loadingSpinner.style.display = 'none';
        renderRepos(cached.repos);
        return;
      }

      // 2) 缓存过期或不存在：先展示骨架屏，再发请求
      renderSkeleton(pageSize);

      try {
        const userRes = await fetch(`https://api.github.com/users/${username}`);
        if (!userRes.ok) throw new Error('无法获取用户信息');
        const user = await userRes.json();

        const reposRes = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
        if (!reposRes.ok) throw new Error('无法获取仓库列表，可能触发了 API 速率限制');
        const repos = await reposRes.json();

        applyUser(user);
        writeCache(user, repos);
        renderRepos(repos);
      } catch (err) {
        // 3) 请求失败但存在旧缓存：降级使用旧数据，保证页面可用
        if (cached && cached.repos){
          applyUser(cached.user);
          renderRepos(cached.repos);
        } else {
          reposContainer.innerHTML = `<div class="empty">载入失败：${err.message}. Github API调取已达到限制【匿名用户每小时60次】，先去看看我的博客等下再来吧~~</div>`;
        }
        console.error(err);
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }

    function renderRepos(repos){
      if (!Array.isArray(repos) || repos.length === 0){
        reposContainer.innerHTML = '<div class="empty">未找到公开仓库。</div>';
        return;
      }

      // 计算每个仓库的活跃度与星数归一化得分，并按综合得分降序排序
      const now = Date.now();
      const msPerDay = 1000 * 60 * 60 * 24;
      const days = repos.map(r => {
        const t = r.pushed_at ? new Date(r.pushed_at) : new Date(r.updated_at);
        return Math.max(0, (now - t.getTime()) / msPerDay);
      });
      const maxDays = Math.max(...days, 1);
      const maxStars = Math.max(...repos.map(r=>r.stargazers_count||0), 1);
      const wActivity = 0.6, wStar = 0.4;

      repos.forEach((r, i) => {
        const activityScore = Math.max(0, (maxDays - days[i]) / maxDays);
        const starScore = (r.stargazers_count || 0) / maxStars;
        r.__combinedScore = activityScore * wActivity + starScore * wStar;
      });

      repos.sort((a,b) => (b.__combinedScore || 0) - (a.__combinedScore || 0));

      // 缓存并渲染第一页
      storedRepos = repos;
      currentPage = 1;
      renderPage(currentPage);
    }

    function renderPage(page){
      const total = storedRepos.length;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      currentPage = page;

      const start = (page - 1) * pageSize;
      const slice = storedRepos.slice(start, start + pageSize);

      const list = document.createElement('div');
      list.className = 'repo-list';

      slice.forEach((r, i)=>{
        const el = document.createElement('div');
        el.className = 'repo';
        el.style.animationDelay = (i * 60) + 'ms';
        const name = document.createElement('div');
        const link = document.createElement('a');
        link.href = r.html_url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = r.name;
        name.appendChild(link);

        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.textContent = r.description || '—';

        const meta = document.createElement('div');
        meta.className = 'meta';
        if (r.language){
          const lang = document.createElement('div');
          lang.className = 'lang-dot';
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.color = langColor(r.language);
          dot.style.background = langColor(r.language);
          lang.appendChild(dot);
          lang.appendChild(document.createTextNode(r.language));
          meta.appendChild(lang);
        }
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = `★ ${r.stargazers_count || 0}`;
        const updated = document.createElement('div');
        const t = r.pushed_at ? new Date(r.pushed_at) : new Date(r.updated_at);
        updated.textContent = `· ${t.toLocaleDateString()}`;

        meta.appendChild(star);
        meta.appendChild(updated);

        el.appendChild(name);
        el.appendChild(desc);
        el.appendChild(meta);
        list.appendChild(el);
      });

      // 分页控件
      const pager = document.createElement('div');
      pager.className = 'pagination';
      const prev = document.createElement('button');
      prev.textContent = '上一页';
      prev.onclick = ()=>{ if (currentPage>1) renderPage(currentPage-1); };
      // 在第一页时隐藏“上一页”按钮
      prev.style.display = page <= 1 ? 'none' : '';
      const info = document.createElement('span');
      info.textContent = `第 ${page} / ${totalPages} 页（共 ${total} 个仓库）`;
      const next = document.createElement('button');
      next.textContent = '下一页';
      next.onclick = ()=>{ if (currentPage<totalPages) renderPage(currentPage+1); };
      // 在最后一页时隐藏“下一页”按钮
      next.style.display = page >= totalPages ? 'none' : '';

      pager.appendChild(prev);
      pager.appendChild(info);
      pager.appendChild(next);

      reposContainer.innerHTML = '';
      reposContainer.appendChild(list);
      reposContainer.appendChild(pager);

      // 翻页后回到仓库列表顶部，避免视觉跳转
      if (page > 1){
        list.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    fetchGitHub();
  </script>
